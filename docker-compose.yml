services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: communication_backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: communication_frontend
    ports:
      - "3000:80"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: communication_ai_service
    ports:
      - "8000:8000"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
