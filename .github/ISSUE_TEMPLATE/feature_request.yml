name: Feature Request
description: Propose new functionality aligned with the platform roadmap.
title: "[feat]: "
labels: ["feature", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Check the [ROADMAP.md](../ROADMAP.md) first — if the feature is already planned, comment on the existing tracking issue instead of opening a new one.

  - type: dropdown
    id: area
    attributes:
      label: Product Area
      options:
        - "AI Interview"
        - "Listening Assessment"
        - "Voice / Audio Processing"
        - "Scoring & Adaptive Difficulty"
        - "Credits"
        - "Reporting & Performance"
        - "Learning Recommendations"
        - "Bounded Agent"
        - "RAG / Knowledge Retrieval"
        - "Auth / RBAC"
        - "Dashboards"
        - "Async Jobs"
        - "Observability"
        - "Infrastructure / DevOps"
        - "Developer Experience"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this solve? Who is affected?
      placeholder: "Students have no way to see which specific skills caused their score to drop between attempts."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should the system do? Be specific about inputs, outputs, and user-visible behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you considered and why you ruled them out.
    validations:
      required: false

  - type: dropdown
    id: srs_alignment
    attributes:
      label: SRS Alignment
      description: Is this feature covered by SRS v3.0?
      options:
        - "Yes — maps to an existing SRS requirement"
        - "Partially — extends an existing requirement"
        - "No — this is new scope"
    validations:
      required: true

  - type: textarea
    id: srs_ref
    attributes:
      label: SRS Reference (if applicable)
      description: e.g. "FR-INT-05, §10.3 Question Generation Inputs"
    validations:
      required: false

  - type: checkboxes
    id: concerns
    attributes:
      label: Concerns to Flag
      options:
        - label: May require a database migration
        - label: Affects the authorization model
        - label: Affects credit accounting
        - label: Introduces a new external dependency
        - label: Affects the interview critical path (synchronous latency impact)
