name: Engineering Task
description: Technical work item — chore, infrastructure, refactor, tooling, or documentation.
title: "[task]: "
labels: ["task"]
assignees: []

body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "Refactor"
        - "Performance"
        - "Infrastructure / DevOps"
        - "Database migration"
        - "Dependency update"
        - "Testing"
        - "Documentation"
        - "CI/CD"
        - "Security hardening"
        - "Observability"
        - "Tooling / DX"
        - "Technical debt"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What needs to be done?
      description: Describe the task clearly. Link to any relevant context, ADRs, or prior discussions.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this task is done?
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Roadmap Phase
      description: Which delivery phase does this belong to?
      options:
        - "Phase 1 — Foundation"
        - "Phase 2 — Auth, RBAC, Profiles"
        - "Phase 3 — AI Interview Core"
        - "Phase 4 — Listening, Credits, Reporting"
        - "Phase 5 — Agent, RAG, Async Pipeline"
        - "Phase 6 — Production Hardening"
        - "Cross-cutting / Maintenance"
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risks or Dependencies
      description: Anything that could block this or that other work depends on.
    validations:
      required: false
