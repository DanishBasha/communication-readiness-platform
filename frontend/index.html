<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://framerusercontent.com" crossorigin>
    <link rel="preload" href="https://framerusercontent.com/assets/Z0vnLF4bDP3AvJUSXYiHFZ3IM.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://framerusercontent.com/assets/1YZLFNNczonjGMOPQJDnjroyrag.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://framerusercontent.com/assets/0U3BLcNbbf9edxKqK8RHjl1Eyn0.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>LatchUp — Let's Catch Up | AI Communication &amp; Placement Readiness</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('crp_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="position: fixed; inset: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; font-family: 'M Saans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 99999;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background-color: #141414; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); animation: logoPulse 2s ease-in-out infinite;">
          <svg viewBox="0 0 36 36" width="38" height="38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 8.5 9.5 V 26.5 H 20" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 15 20 L 27.5 7.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 18.5 7.5 H 27.5 V 16.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="loader-title" style="font-size: 26px; font-weight: 700; font-family: 'M Saans', 'Inter', sans-serif; color: #141414; letter-spacing: -0.03em;">Latch<span style="color: #717171; font-weight: 600;">Up</span></span>
          <span class="loader-badge" style="font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace; background-color: #fafafa; color: #141414; padding: 2px 7px; border-radius: 6px; border: 1px solid #ededed; letter-spacing: 0.08em; text-transform: uppercase;">LET'S CATCH UP</span>
        </div>
        <style>
          @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 0.90; }
            50% { transform: scale(1.08); opacity: 1; }
          }
          html.dark #initial-loader {
            background-color: #0a0a0a !important;
          }
          html.dark #initial-loader .loader-title {
            color: #f5f5f5 !important;
          }
          html.dark #initial-loader .loader-badge {
            background-color: #171717 !important;
            color: #ededed !important;
            border-color: #2e2e2e !important;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
